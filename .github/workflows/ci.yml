# Continuous integration, and the only path to a release.
#
# Three validation jobs run in parallel because the Python API, the web UI and
# the container image fail for unrelated reasons and a maintainer should see all
# three verdicts from a single push. The `release` job at the bottom calls
# release.yml and `needs` all three, which is what makes a failed check block
# publishing instead of racing it.

name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the network out of the default suite: these markers exclude the tests
  # that need outbound access or a real browser.
  PYTEST_MARKERS: not network and not browser

jobs:
  python:
    name: Python (lint, types, imports, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Formatting is checked, never applied: CI does not rewrite the tree.
      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      # Enforces the layered dependency direction declared in pyproject's
      # [tool.importlinter] contracts. A failure here is an architecture
      # regression, not a style nit, so it gates the same as the tests.
      - name: Import contracts
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest -m "${{ env.PYTEST_MARKERS }}" --cov=src/applyuminati

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` requires a committed lockfile; the fallback keeps a fresh
      # checkout that has not committed one yet from failing the whole run.
      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      # Last, because a build failure is only interesting once the code is sane.
      - name: Build
        run: npm run build

  docker:
    name: Docker image and stack file
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Single-platform with `load: true`, so the smoke test below can actually
      # run the image. release.yml is what builds multi-arch and pushes.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: applyuminati:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image is coherent end to end: the venv is on PATH, the
      # entrypoint's `cli` dispatch works, and the Typer app imports -- which
      # transitively imports the whole package graph.
      - name: Smoke test the CLI
        run: docker run --rm applyuminati:ci cli --help

      # The deployable stack file is pasted into Portainer by hand, so a syntax
      # error or a missing default would otherwise be discovered by a user
      # mid-deploy. `config` resolves every interpolation with no .env present.
      - name: Validate deployable stack file
        run: docker compose -f docker-compose.yml config

  # -------------------------------------------------------------------------
  # Release
  # -------------------------------------------------------------------------
  # The gate. `needs` lists every validation job, so GitHub will not start this
  # job -- and therefore cannot publish an image -- unless all of them
  # succeeded. Pull requests are excluded because a fork must never be able to
  # push to the registry, and only main and v* tags are publishable refs.
  #
  # release.yml is called rather than triggered on its own event, so there is no
  # second, ungated path to publishing. tests/test_workflows.py asserts both
  # halves of that: the `needs` list here, and the absence of a `push` trigger
  # there.
  release:
    name: Release
    needs: [python, web, docker]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      push: true

  # -------------------------------------------------------------------------
  # PyPI distribution
  # -------------------------------------------------------------------------
  # The same gate as the image release: `needs` every validation job, no
  # pull_request, and a publishable ref only. pypi.yml is called rather than
  # triggered, so there is no second, ungated path to an upload.
  #
  # `publish: false` means this job builds the wheel and sdist and runs the
  # metadata check on every main merge and every tag, and uploads nothing. The
  # first real publish flips that single value to true; nothing else changes.
  pypi:
    name: PyPI distribution
    needs: [python, web, docker]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # A called workflow cannot widen the token permissions it is handed: it
    # gets the intersection of what the caller grants and what it declares.
    # Declaring `id-token: write` only in pypi.yml would therefore mint no
    # OIDC token, and the upload step would fail against PyPI instead, so the
    # grant has to live here. This is the one job in CI holding upload
    # authority, and it is still behind `needs` and the ref gate above.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pypi.yml
    with:
      publish: false
