# Alembic configuration for Applyuminati.
#
# The database URL is not stored here on purpose: ``env.py`` resolves it from
# the typed application settings (``applyuminati.core.settings``), which means
# ``APPLYUMINATI_DATABASE_URL`` and ``config.toml`` work for migrations exactly
# as they do for the API. A static URL in this file would be a second,
# silently-diverging source of truth.

[alembic]
script_location = src/applyuminati/db/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
version_table = alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
